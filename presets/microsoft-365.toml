name = "microsoft-365"
description = "Microsoft 365 email configuration"

[[variables]]
name = "tenant"
description = "Microsoft 365 tenant name (e.g., contoso for contoso.onmicrosoft.com)"
required = true

[[records]]
type = "MX"
host = "@"
value = "{{tenant}}-com.mail.protection.outlook.com."
ttl = 3600
priority = 0

[[records]]
type = "TXT"
host = "@"
value = "v=spf1 include:spf.protection.outlook.com -all"
ttl = 3600

[[records]]
type = "CNAME"
host = "autodiscover"
value = "autodiscover.outlook.com."
ttl = 3600

[[records]]
type = "CNAME"
host = "selector1._domainkey"
value = "selector1-{{tenant}}-com._domainkey.{{tenant}}.onmicrosoft.com."
ttl = 3600

[[records]]
type = "CNAME"
host = "selector2._domainkey"
value = "selector2-{{tenant}}-com._domainkey.{{tenant}}.onmicrosoft.com."
ttl = 3600

[[records]]
type = "TXT"
host = "_dmarc"
value = "v=DMARC1; p=quarantine; rua=mailto:dmarcreports@{{tenant}}.com"
ttl = 3600
